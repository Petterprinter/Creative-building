<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lava Lamp</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;overflow:hidden}canvas{display:block}
    a#back,button{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;cursor:pointer;backdrop-filter:blur(8px);transition:background 0.2s;font-family:system-ui,sans-serif;text-decoration:none}
    a#back:hover,button:hover{background:rgba(255,255,255,0.18)}
    #back{position:fixed;top:20px;left:24px;z-index:10}
    #ui{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10}
    #hint{position:fixed;top:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.25);font-size:12px;font-family:system-ui,sans-serif;letter-spacing:0.05em;pointer-events:none}
  </style>
</head>
<body>
  <a id="back" href="index.html">← Gallery</a>
  <div id="hint">LAVA LAMP · warm blobs rising slowly</div>
  <div id="ui"><button id="btn-save">Save</button></div>
  <script>
    const BLOB_COLORS=[[255,60,120],[255,130,0],[180,0,255],[255,200,30],[0,160,255],[255,80,180]];
    new p5(function(p){
      let blobs=[],t=0;
      function makeBlob(i,randomY){
        return{x:p.random(p.width*0.15,p.width*0.85),y:randomY?p.random(p.height):p.height+p.random(50,180),vx:p.random(-0.08,0.08),vy:p.random(-0.12,0.06),r:p.random(55,105),col:BLOB_COLORS[i%BLOB_COLORS.length],phase:p.random(p.TWO_PI)};}
      p.setup=function(){const cnv=p.createCanvas(p.windowWidth,p.windowHeight);cnv.style('display','block');p.frameRate(60);p.noStroke();blobs=Array.from({length:7},(_, i)=>makeBlob(i,true));};
      p.draw=function(){
        t+=0.005;p.background(8,4,18);
        p.blendMode(p.ADD);
        blobs.forEach((b,i)=>{
          b.x+=b.vx+Math.sin(t+b.phase)*0.10;
          b.y+=b.vy+Math.sin(t*0.7+b.phase*1.3)*0.08;
          b.vx*=0.99;
          if(b.x<b.r*0.5)b.vx+=0.04;if(b.x>p.width-b.r*0.5)b.vx-=0.04;
          if(b.y<-b.r*2){b.y=p.height+b.r;b.x=p.random(p.width*0.15,p.width*0.85);b.vy=p.random(-0.12,0.06);}
          const[r,g,bl]=b.col;
          for(let layer=6;layer>=0;layer--){
            const lr=b.r*(1+layer*0.45);
            const al=p.map(layer,0,6,75,3);
            p.fill(r,g,bl,al);p.ellipse(b.x,b.y,lr*2,lr*2);
          }
        });
        p.blendMode(p.BLEND);
      };
      p.windowResized=function(){p.resizeCanvas(p.windowWidth,p.windowHeight);blobs=Array.from({length:7},(_,i)=>makeBlob(i,true));};
      document.getElementById('btn-save').addEventListener('click',()=>{p.saveCanvas('lava-lamp','png');});
    });
  </script>
</body>
</html>
