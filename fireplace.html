<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fireplace</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;overflow:hidden}canvas{display:block}
    a#back,button{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;cursor:pointer;backdrop-filter:blur(8px);transition:background 0.2s;font-family:system-ui,sans-serif;text-decoration:none}
    a#back:hover,button:hover{background:rgba(255,255,255,0.18)}
    #back{position:fixed;top:20px;left:24px;z-index:10}
    #ui{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10}
    #hint{position:fixed;top:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.3);font-size:12px;font-family:system-ui,sans-serif;letter-spacing:0.05em;pointer-events:none}
  </style>
</head>
<body>
  <a id="back" href="index.html">← Gallery</a>
  <div id="hint">FIREPLACE · press Sound to hear the fire crackle</div>
  <div id="ui">
    <button id="btn-sound">🔇 Sound</button>
    <button id="btn-save">Save</button>
  </div>
  <script>
    // ─ Audio ───────────────────────────────────────────────────────
    let audioCtx=null, masterGain=null, soundOn=false;

    function buildFireSound(){
      const sr=audioCtx.sampleRate;
      const len=sr*4;
      const buf=audioCtx.createBuffer(1,len,sr);
      const d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;

      function layer(rate,type,freq,Q,gain){
        const src=audioCtx.createBufferSource();
        src.buffer=buf; src.loop=true; src.playbackRate.value=rate;
        const f=audioCtx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=Q;
        const g=audioCtx.createGain(); g.gain.value=gain;
        src.connect(f); f.connect(g); g.connect(masterGain); src.start();
        return g;
      }
      // Low rumble
      layer(1.0,'lowpass',300,0.7,0.45);
      // Mid crackle + LFO
      const mid=layer(1.25,'bandpass',750,2.5,0.16);
      const lfo=audioCtx.createOscillator(); lfo.type='sine'; lfo.frequency.value=2.1;
      const lg=audioCtx.createGain(); lg.gain.value=0.13;
      lfo.connect(lg); lg.connect(mid.gain); lfo.start();
      // High hiss
      layer(0.75,'highpass',1800,1,0.05);
    }

    function scheduleCrackle(){
      setTimeout(()=>{
        if(audioCtx && soundOn){
          const sr=audioCtx.sampleRate;
          const plen=Math.floor(sr*(0.03+Math.random()*0.09));
          const pb=audioCtx.createBuffer(1,plen,sr);
          const pd=pb.getChannelData(0);
          for(let i=0;i<plen;i++) pd[i]=(Math.random()*2-1)*Math.exp(-i/(plen*0.13));
          const src=audioCtx.createBufferSource(); src.buffer=pb;
          const f=audioCtx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=350+Math.random()*900;
          const g=audioCtx.createGain(); g.gain.value=0.4+Math.random()*0.5;
          src.connect(f); f.connect(g); g.connect(masterGain); src.start();
        }
        scheduleCrackle();
      }, 600+Math.random()*2800);
    }

    function startSound(){
      if(!audioCtx){
        audioCtx=new(window.AudioContext||window.webkitAudioContext)();
        masterGain=audioCtx.createGain(); masterGain.gain.value=0; masterGain.connect(audioCtx.destination);
        buildFireSound(); scheduleCrackle();
      }
      if(audioCtx.state==='suspended') audioCtx.resume();
      masterGain.gain.setTargetAtTime(0.6,audioCtx.currentTime,0.5);
      soundOn=true;
      document.getElementById('btn-sound').textContent='🔊 Sound On';
    }
    function stopSound(){
      masterGain.gain.setTargetAtTime(0,audioCtx.currentTime,0.5);
      soundOn=false;
      document.getElementById('btn-sound').textContent='🔇 Sound Off';
    }
    document.getElementById('btn-sound').addEventListener('click',()=>{ soundOn?stopSound():startSound(); });

    // ─ Sketch ──────────────────────────────────────────────────
    new p5(function(p){
      let particles=[], sparks=[], t=0;
      let fw,fh,fx,fy; // firebox opening

      function layout(){
        const s=Math.min(p.width*0.9, p.height*0.82);
        fw=s*0.40; fh=s*0.32;
        fx=p.width/2-fw/2; fy=p.height/2-fh*0.15;
      }

      function spawnFire(){
        for(let i=0;i<5;i++){
          particles.push({
            x: fx+fw*0.08+Math.random()*fw*0.84,
            y: fy+fh-12+Math.random()*8,
            vx: (Math.random()-0.5)*0.6,
            vy: -(0.6+Math.random()*1.2),
            life: 1.0,
            decay: 0.007+Math.random()*0.010,
            size: 22+Math.random()*32,
            no: Math.random()*100
          });
        }
      }

      function spawnSpark(){
        if(Math.random()<0.10){
          sparks.push({
            x: fx+fw*0.2+Math.random()*fw*0.6,
            y: fy+fh*0.55,
            vx: (Math.random()-0.5)*2.8,
            vy: -(1.5+Math.random()*2.5),
            life: 1.0,
            size: 1.5+Math.random()*2
          });
        }
      }

      function fireColor(life){
        if(life>0.78){return[255, p.map(life,0.78,1,160,255), p.map(life,0.78,1,0,130), life*190];}
        else if(life>0.45){return[255, p.map(life,0.45,0.78,60,160), 0, life*210];}
        else{return[p.map(life,0,0.45,60,255), 15, 0, life*200];}
      }

      function drawStone(){
        const sL=p.color(105,88,70), sD=p.color(68,54,40), sM=p.color(48,36,26);
        // Mantle beam
        const mW=fw*1.78, mH=fh*0.11, mX=p.width/2-mW/2, mY=fy-fh*0.36-mH;
        p.noStroke(); p.fill(sL); p.rect(mX,mY,mW,mH,4);
        p.fill(sD); p.rect(mX,mY+mH-7,mW,7,0,0,4,4);
        // Left pillar
        const pW=fw*0.21, pY=fy-fh*0.35, pH=fh*1.48;
        p.fill(sL); p.rect(fx-pW,pY,pW,pH,4,0,0,4);
        p.fill(sD); p.rect(fx-7,pY,7,pH);
        // Right pillar
        p.fill(sL); p.rect(fx+fw,pY,pW,pH,0,4,4,0);
        p.fill(sD); p.rect(fx+fw,pY,7,pH);
        // Arch above opening
        p.fill(sM);
        p.arc(p.width/2,fy,fw*1.04,fh*0.68,p.PI,p.TWO_PI);
        // Hearth ledge
        p.fill(sD); p.rect(fx-fw*0.12,fy+fh,fw*1.24,fh*0.08,0,0,5,5);
      }

      function drawFirebox(){
        // Dark interior
        p.fill(6,3,2); p.noStroke(); p.rect(fx,fy,fw,fh);
      }

      function drawEmbers(){
        // Glowing coals
        for(let x=fx+8;x<fx+fw-8;x+=7){
          const g=0.5+0.5*Math.sin(t*2.2+x*0.12);
          p.fill(220*g,70*g,0,190);
          p.ellipse(x+Math.random()*3-1.5,fy+fh-6,4+Math.random()*3,2.5);
        }
        // Logs
        p.fill(52,30,14); p.rect(fx+12,fy+fh-22,fw-24,18,5);
        p.fill(38,22,10); p.rect(fx+28,fy+fh-16,fw-56,14,4);
        // Log glow
        p.fill(255,90,0,40);
        p.rect(fx+12,fy+fh-22,fw-24,18,5);
      }

      p.setup=function(){const cnv=p.createCanvas(p.windowWidth,p.windowHeight);cnv.style('display','block');p.frameRate(60);layout();};

      p.draw=function(){
        t+=0.018;
        // Room
        p.background(16,10,6);
        // Warm glow on room walls & floor
        const flicker=0.88+Math.sin(t*3.5)*0.07+Math.sin(t*8.1)*0.04;
        p.noStroke();
        for(let r=p.height*1.3;r>0;r-=22){
          p.fill(255,100,15,p.map(r,0,p.height,28,0)*flicker);
          p.ellipse(p.width/2,fy+fh+10,r*1.7,r*0.85);
        }
        // Stone structure (behind firebox)
        drawStone();
        // Dark firebox
        drawFirebox();
        // Fire inside (clipped to firebox)
        p.drawingContext.save();
        p.drawingContext.beginPath();
        p.drawingContext.rect(fx,fy,fw,fh);
        p.drawingContext.clip();
        // Embers
        drawEmbers();
        // Spawn
        spawnFire(); spawnSpark();
        // Fire particles
        for(let i=particles.length-1;i>=0;i--){
          const pt=particles[i];
          pt.vx+=(p.noise(pt.x*0.04,pt.y*0.04,t+pt.no)-0.5)*0.28;
          pt.vx*=0.94; pt.x+=pt.vx; pt.y+=pt.vy; pt.life-=pt.decay;
          if(pt.life<=0){particles.splice(i,1);continue;}
          const [r,g,b,a]=fireColor(pt.life);
          const sz=pt.size*Math.min(1,pt.life*2);
          p.noStroke(); p.fill(r,g,b,a); p.ellipse(pt.x,pt.y,sz,sz*1.35);
          p.fill(255,240,180,a*0.3); p.ellipse(pt.x,pt.y,sz*0.35,sz*0.45);
        }
        p.drawingContext.restore();
        // Sparks escape firebox, float upward
        for(let i=sparks.length-1;i>=0;i--){
          const s=sparks[i];
          s.x+=s.vx; s.y+=s.vy; s.vy+=0.05; s.vx*=0.99; s.life-=0.018;
          if(s.life<=0||s.y<0){sparks.splice(i,1);continue;}
          const a=s.life*255;
          p.noStroke(); p.fill(255,Math.random()>0.4?180:80,0,a);
          p.ellipse(s.x,s.y,s.size,s.size);
        }
      };

      p.windowResized=function(){p.resizeCanvas(p.windowWidth,p.windowHeight);layout();particles=[];sparks=[];};
      document.getElementById('btn-save').addEventListener('click',()=>{p.saveCanvas('fireplace','png');});
    });
  </script>
</body>
</html>
